<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TERG Goodshuffle messages</title>
    <style>
      body { font: 14px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; width: 380px; color: #1c1917; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: #57534e; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      input { box-sizing: border-box; width: 100%; padding: 7px 9px; border: 1px solid #d6d3d1; border-radius: 8px; font: inherit; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { padding: 7px 12px; border-radius: 8px; border: 1px solid #d6d3d1; background: #fff; font: inherit; cursor: pointer; }
      button.go { background: #4f46e5; color: #fff; border-color: #4f46e5; }
      #status { margin-top: 14px; padding: 10px; border-radius: 8px; background: #f5f5f4; white-space: pre-wrap; }
      #status.bad { background: #fef2f2; color: #991b1b; }
    </style>
  </head>
  <body>
    <h1>TERG Goodshuffle messages</h1>
    <p>Copies new Goodshuffle Pro messages to the dashboard's Inbox. Replies are typed into Goodshuffle and sent only after someone presses Approve in the dashboard. It does nothing unless Goodshuffle is signed in as support@theeventrentalguys.com.</p>
    <label for="dashboard">Dashboard address</label>
    <input id="dashboard" type="url" placeholder="https://your-dashboard.vercel.app" />
    <label for="token">Token (from the dashboard's Settings)</label>
    <input id="token" type="password" placeholder="gsp_…" autocomplete="off" />
    <div class="row">
      <button id="save" class="go">Save and check now</button>
      <button id="run">Check now</button>
    </div>
    <div id="status">Not set up yet.</div>
    <script src="options.js"></script>
  </body>
</html>
